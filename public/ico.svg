<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <circle cx="96" cy="96" r="84" fill="#4a5565"/>
  <!-- Calendar body -->
  <g transform="translate(48, 52)">
    <!-- Calendar frame -->
    <rect x="0" y="0" width="96" height="88" fill="white" rx="4"/>
    
    <!-- Top bar -->
    <rect x="0" y="0" width="96" height="16" fill="#3b82f6" rx="4"/>
    
    <!-- Month/Year text area -->
    <circle cx="24" cy="8" r="3" fill="white"/>
    <circle cx="36" cy="8" r="3" fill="white"/>
    <circle cx="48" cy="8" r="3" fill="white"/>
    
    <!-- Grid lines -->
    <line x1="0" y1="24" x2="96" y2="24" stroke="#d1d5db" stroke-width="1"/>
    <line x1="0" y1="36" x2="96" y2="36" stroke="#d1d5db" stroke-width="1"/>
    <line x1="0" y1="48" x2="96" y2="48" stroke="#d1d5db" stroke-width="1"/>
    <line x1="0" y1="60" x2="96" y2="60" stroke="#d1d5db" stroke-width="1"/>
    <line x1="0" y1="72" x2="96" y2="72" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Vertical lines -->
    <line x1="16" y1="24" x2="16" y2="88" stroke="#d1d5db" stroke-width="1"/>
    <line x1="32" y1="24" x2="32" y2="88" stroke="#d1d5db" stroke-width="1"/>
    <line x1="48" y1="24" x2="48" y2="88" stroke="#d1d5db" stroke-width="1"/>
    <line x1="64" y1="24" x2="64" y2="88" stroke="#d1d5db" stroke-width="1"/>
    <line x1="80" y1="24" x2="80" y2="88" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Highlighted date -->
    <circle cx="40" cy="42" r="5" fill="#3b82f6"/>
  </g>
</svg>
